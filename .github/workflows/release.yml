name: Build & Release

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ── Release metadata (tag / version / rolling) ─────────────────────────────
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      rolling: ${{ steps.meta.outputs.rolling }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          app_version="$(sed -n 's/^VERSION = "\(.*\)"/\1/p' ripwave.py | tr -d '\r')"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
            rolling="false"
            if [[ "$version" != "$app_version" ]]; then
              echo "::error::tag $tag does not match VERSION=$app_version in ripwave.py"
              exit 1
            fi
          else
            tag="latest"
            version="$app_version"
            rolling="true"
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "rolling=$rolling"
          } >> "$GITHUB_OUTPUT"

  # ── Windows: RipWave-Setup.exe + portable zip ──────────────────────────────
  windows:
    needs: meta
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build RipWave.exe
        run: |
          pyinstaller --onefile --windowed `
            --name RipWave `
            --icon assets/icon.ico `
            --version-file version_info.txt `
            --add-data "assets/icon.ico;assets" `
            ripwave.py

      - name: Download yt-dlp
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "dist/yt-dlp.exe"

      # ffprobe.exe is required by the installer (MP4 verification) — extract both.
      - name: Download ffmpeg + ffprobe
        run: |
          $tmp = "$env:TEMP\ffmpeg.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" `
            -OutFile $tmp
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead($tmp)
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $entry = $zip.Entries | Where-Object { $_.Name -eq $name } | Select-Object -First 1
            if (-not $entry) { throw "$name not found in ffmpeg zip" }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "dist/$name", $true)
          }
          $zip.Dispose()

      # RipWave.exe is a GUI-subsystem binary: PowerShell's `&` returns at once and
      # leaves $LASTEXITCODE empty, so wait on the process explicitly.
      - name: Self-test the frozen build
        run: |
          $p = Start-Process -FilePath (Resolve-Path dist/RipWave.exe) -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "RipWave.exe --selftest failed (exit $($p.ExitCode))" }

      - name: Build one-click installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & "$iscc" "/DMyAppVersion=${{ needs.meta.outputs.version }}" installer\ripwave.iss
          if (-not (Test-Path "installer\RipWave-Setup.exe")) {
            throw "RipWave-Setup.exe was not produced"
          }

      - name: Package portable zip
        run: Compress-Archive -Path dist/* -DestinationPath RipWave-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            installer/RipWave-Setup.exe
            RipWave-windows.zip

  # ── macOS: RipWave.app in a DMG, one per CPU ───────────────────────────────
  macos:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build RipWave.app + DMG
        env:
          ARCH: ${{ matrix.arch }}
        run: bash build-mac.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: dist/RipWave-macOS-${{ matrix.arch }}.dmg

  # ── Publish everything that built ──────────────────────────────────────────
  # Runs even if one platform failed so a broken Intel runner never blocks the
  # Windows + Apple Silicon assets; the failed job still turns the run red.
  release:
    needs: [meta, windows, macos]
    if: always() && needs.meta.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List assets
        run: ls -la release

      - name: Move rolling 'latest' tag
        if: needs.meta.outputs.rolling == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const ref = 'tags/latest';
            const sha = context.sha;
            try {
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                sha,
                force: true,
              });
            } catch (err) {
              if (err.status === 422 || err.status === 404) {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/${ref}`,
                  sha,
                });
              } else {
                throw err;
              }
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.rolling == 'true' && 'RipWave (rolling master build)' || format('RipWave {0}', needs.meta.outputs.tag) }}
          # Only tagged releases become "Latest" — that is what /releases/latest/download resolves to.
          make_latest: ${{ needs.meta.outputs.rolling == 'true' && 'false' || 'true' }}
          prerelease: ${{ needs.meta.outputs.rolling == 'true' }}
          files: release/*
          generate_release_notes: ${{ needs.meta.outputs.rolling == 'false' }}
          body: ${{ needs.meta.outputs.rolling == 'true' && 'Rolling build from latest master — untested. Use the Latest tagged release unless you know why you want this.' || '' }}
